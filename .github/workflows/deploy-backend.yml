name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          curl "https://api.render.com/deploy/srv-${{ secrets.RENDER_BACKEND_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}"

      - name: Wait for deployment
        run: |
          echo "Backend deployment triggered on Render"
          echo "Check deployment status at: https://dashboard.render.com"

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Backend deployed successfully to Render"
